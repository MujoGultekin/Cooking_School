{% extends "base.html" %}

{% block title %}Create Cooking Class — Culinary Academy{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <section class="col-lg-8">
        <div class="card card-culinary p-4">
            <header class="mb-4">
                <h1 class="h3 fw-bold">Create New Cooking Class</h1>
                <p class="text-muted small">Fill in all details, ingredients, and upload 3 promotional images.</p>
            </header>

            <form method="post" enctype="multipart/form-data" action="{{ url_for('manager.create_class') }}">
                <div class="mb-3">
                    <label for="title" class="form-label">Class Title</label>
                    <input type="text" class="form-control" id="title" name="title" required placeholder="e.g. Master Class: Homemade Fresh Pasta">
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label for="cuisine" class="form-label">Cuisine Type</label>
                        <input type="text" class="form-control" id="cuisine" name="cuisine" required placeholder="e.g. Italian">
                    </div>
                    <div class="col-md-4">
                        <label for="difficulty" class="form-label">Difficulty Level</label>
                        <select class="form-select" id="difficulty" name="difficulty" required>
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate" selected>Intermediate</option>
                            <option value="Advanced">Advanced</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="duration" class="form-label">Duration (Minutes)</label>
                        <input type="number" class="form-control" id="duration" name="duration" min="30" max="300" required placeholder="120">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="dietary_category" class="form-label">Dietary Category</label>
                        <select class="form-select" id="dietary_category" name="dietary_category" required>
                            <option value="Standard" selected>Standard</option>
                            <option value="Vegetarian">Vegetarian</option>
                            <option value="Vegan">Vegan</option>
                            <option value="Gluten-free">Gluten-free</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="chef_name" class="form-label">Chef / Instructor Name</label>
                        <input type="text" class="form-control" id="chef_name" name="chef_name" required placeholder="e.g. Chef Mario Rossi">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="ingredients" class="form-label">Main Ingredients (At least 4, separated by commas)</label>
                    <input type="text" class="form-control" id="ingredients" name="ingredients" required placeholder="Flour, Eggs, Olive Oil, Parmigiano Cheese">
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Full Class Description</label>
                    <textarea class="form-control" id="description" name="description" rows="4" required placeholder="Describe what students will learn..."></textarea>
                </div>

                <hr class="my-4">
                <h2 class="h5 fw-bold mb-3">Promotional Photos (Upload 3 required images)</h2>

                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label for="photo_1" class="form-label">Photo 1 (Primary)</label>
                        <input type="file" class="form-control" id="photo_1" name="photo_1" accept="image/*" required>
                    </div>
                    <div class="col-md-4">
                        <label for="photo_2" class="form-label">Photo 2</label>
                        <input type="file" class="form-control" id="photo_2" name="photo_2" accept="image/*" required>
                    </div>
                    <div class="col-md-4">
                        <label for="photo_3" class="form-label">Photo 3</label>
                        <input type="file" class="form-control" id="photo_3" name="photo_3" accept="image/*" required>
                    </div>
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <a href="{{ url_for('manager.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary fw-bold">Create Class</button>
                </div>
            </form>
        </div>
    </section>
</div>
{% endblock %}
