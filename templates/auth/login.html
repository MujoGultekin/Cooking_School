{% extends "base.html" %}

{% block title %}Login — Culinary Academy{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <section class="col-md-6 col-lg-5">
        <div class="card card-culinary p-4">
            <header class="text-center mb-4">
                <h1 class="h3 fw-bold">Welcome Back</h1>
                <p class="text-muted small">Log in to manage or join cooking classes</p>
            </header>
            <form method="post" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
            </form>
            <footer class="text-center">
                <p class="small text-muted mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a></p>
            </footer>
        </div>
    </section>
</div>
{% endblock %}
